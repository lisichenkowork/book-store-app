databaseChangeLog:
  - changeSet:
      id: 13-create-shopping-cart-table
      author: max
      changes:
        - createTable:
            tableName: shopping_cart
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
           baseTableName: shopping_cart
           referencedTableName: users
           baseColumnNames: user_id
           referencedColumnNames: id
           constraintName: fk-shopping-cart-user