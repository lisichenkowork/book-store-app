databaseChangeLog:
  - changeSet:
      id: insert-default-books
      author: max
      changes:
        - insert:
            tableName: books
            columns:
              - column:
                  name: title
                  value: "The Left Hand of Darkness"
              - column:
                  name: author
                  value: "Ursula K. Le Guin"
              - column:
                  name: isbn
                  value: "9780441478125"
              - column:
                  name: price
                  valueNumeric: 39.90
              - column:
                  name: description
                  value: "A science fiction novel exploring gender, politics, and culture on the planet Gethen."
              - column:
                  name: cover_image
                  value: "left_hand_of_darkness.jpg"
              - column:
                  name: is_deleted
                  valueBoolean: false

        - insert:
            tableName: books
            columns:
              - column:
                  name: title
                  value: "The Black Company"
              - column:
                  name: author
                  value: "Glen Cook"
              - column:
                  name: isbn
                  value: "9780812521392"
              - column:
                  name: price
                  valueNumeric: 42.50
              - column:
                  name: description
                  value: "A dark fantasy novel following a mercenary company serving powerful and dangerous rulers."
              - column:
                  name: cover_image
                  value: "black_company.jpg"
              - column:
                  name: is_deleted
                  valueBoolean: false
