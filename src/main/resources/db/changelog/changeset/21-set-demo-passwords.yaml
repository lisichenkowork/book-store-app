databaseChangeLog:
  - changeSet:
      id: set-demo-passwords
      author: max
      comment: "Set known BCrypt passwords for the seeded demo accounts so the frontend can log in (user12345 / admin12345)."
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: password
                  value: "$2b$10$qJHS/9cDF6zn7oczjlyXderunBAtq4XDcprE05fJX3ABErtlX168W"
            where: email = 'user@gmail.com'
        - update:
            tableName: users
            columns:
              - column:
                  name: password
                  value: "$2b$10$QiftPCyndZc8QZt5Ws3/I.6OjFGZQXOA0HNhu5O1AsaxQPwiki09q"
            where: email = 'admin@gmail.com'
